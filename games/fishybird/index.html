<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FishyBird</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <p id="banner" class="banner" aria-live="polite"></p>
      <div id="game"></div>
      <div class="controls">
        <button id="skip" class="control" type="button">Skip the intro</button>
        <button id="replay" class="control" type="button">Hear it again</button>
        <p id="score" class="score" aria-live="polite"></p>
      </div>
      <div id="start" class="start-overlay">
        <button id="start-button" class="start-button" type="button">Start</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
